<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>
    <p>Please fill in all the details carefully.</p>

    <form>

        <!-- Personal Information -->
        <h2>Personal Information</h2>

        <label>Full Name</label><br>
        <input type="text" placeholder="Enter your full name"><br><br>

        <label>Father's Name</label><br>
        <input type="text" placeholder="Enter father's name"><br><br>

       

        <label>Date of Birth</label><br>
        <input type="date"><br><br>

        <label>Gender</label><br>
        <select>
            <option value="">Select gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select><br><br>

        <label>Religion</label><br>
        <select>
            <option value="">Select religion</option>
            <option>Islam</option>
            <option>Christianity</option>
            <option>Hinduism</option>
            <option>Other</option>
        </select><br><br>

        <label>Nationality</label><br>
        <input type="text" placeholder="e.g. Pakistani"><br><br>

        <label>CNIC / B-Form Number</label><br>
        <input type="text" placeholder="XXXXX-XXXXXXX-X"><br><br>

        <!-- Academic Information -->
        <h3>Academic Information</h3>

        <label>Class / Grade</label><br>
        <input type="text" placeholder="e.g. 10th, FSC, BS"><br><br>

        <label>Roll Number</label><br>
        <input type="text" placeholder="Enter roll number"><br><br>

        <label>Section</label><br>
        <select>
            <option value="">Select section</option>
            <option>A</option>
            <option>B</option>
            <option>C</option>
            <option>D</option>
        </select><br><br>

        <label>Subject</label><br>
        <select>
            <option value="">Select subject</option>
            <option>Science</option>
            <option>Arts</option>
            <option>Commerce</option>
            <option>Computer Science</option>
        </select><br><br>

        <label>Previous School / College</label><br>
        <input type="text" placeholder="Enter previous institution name"><br><br>

        <label>Previous Marks / GPA</label><br>
        <input type="text" placeholder="e.g. 850/1100 or 3.5 GPA"><br><br>

        <!-- Contact Information -->
        <h3>Contact Information</h3>

        <label>Email Address</label><br>
        <input type="email" placeholder="student@email.com"><br><br>

        <label>Phone Number</label><br>
        <input type="tel" placeholder="03XX-XXXXXXX"><br><br>

        <label>Emergency Contact Number</label><br>
        <input type="tel" placeholder="Parent/Guardian number"><br><br>

        <label>Address</label><br>
        <textarea placeholder="Enter your home address" rows="3"></textarea><br><br>

        <label>City</label><br>
        <input type="text" placeholder="Enter your city"><br><br>

        <!-- Photo Upload -->
        <h3>Photo</h3>

        <label>Upload Your Photo</label><br>
        <input type="file" accept="image/*"><br><br>

        <!-- Declaration -->
        <h3>Declaration</h3>

        <input type="checkbox"> 
        <label>I confirm that all information provided is correct.</label><br><br>

        <button type="submit">Submit Registration</button>
        <button type="reset">Clear Form</button>

    </form>

</body>
</html>
